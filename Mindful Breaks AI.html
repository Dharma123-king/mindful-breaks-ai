      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      background: #ffffff;
      color: #102a43;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .result {
      margin-top: 25px;
      padding: 22px;
      background: rgba(255,255,255,0.08);
      border-radius: 16px;

    }

    .result h2 {
      margin-bottom: 10px;
    }

    .timer {
      font-size: 48px;
      font-weight: bold;
      margin: 15px 0;
    }

    .progress {
      height: 8px;
      background: rgba(255,255,255,0.15);

      overflow: hidden;
    }

    .bar {

      width: 0%;

    @media (max-width: 650px) {
      .dashboard {
        grid-template-columns: 1fr;

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🧠</div>
      <h1>Mindful Breaks AI</h1>
      <p class="subtitle">
        Smart breaks for a healthier, calmer and more focused mind.
      </p>
    </div>

    <div class="dashboard">

      <div class="card">
        <p>Focus Score</p>
        <div class="number">87%</div>
      </div>

      <div class="card">
        <p>Breaks Today</p>
        <div class="number" id="breakCount">0</div>
      </div>

      <div class="card">
        <p>Mind Status</p>
        <div class="number">😊</div>
      </div>

    </div>

    <div class="main">

      <p class="question">
        How are you feeling right now?
      </p>

      <div class="buttons">
        <button onclick="startBreak(&#39;stressed&#39;)">
          😣 Stressed
        </button>

        <button onclick="startBreak(&#39;tired&#39;)">
          😴 Tired
        </button>

        <button onclick="startBreak(&#39;distracted&#39;)">
          📱 Distracted
        </button>

        <button onclick="startBreak(&#39;okay&#39;)">
          😊 I'm Okay
        </button>
      </div>

      <div class="result" id="result">

        <h2 id="recommendation"></h2>

        <p id="description"></p>

        <div class="timer" id="timer">01:00</div>

        <div class="progress">
          <div class="bar" id="bar"></div>
        </div>

        <br>

        <button onclick="startTimer()">
          ▶ Start Break
        </button>

      </div>

    </div>

    <div class="footer">
      Mindful Breaks AI • Your mind deserves a pause.
    </div>

  </div>

  <script>

    let selectedBreak = "";
    let seconds = 60;
    let timerRunning = false;
    let breakCount = 0;

    const recommendations = {

      stressed: {
        title: "🌿 Try a breathing break",
        description:
          "Slow your breathing and relax your shoulders. Give your mind one quiet minute."
      },

      tired: {
        title: "💧 Try a refresh break",
        description:
          "Stand up, stretch your body and take a few slow breaths before returning to work."
      },

      distracted: {
        title: "🎯 Try a focus reset",
        description:
          "Look away from your screen and focus on one object for a few seconds."
      },

      okay: {
        title: "☀️ Try a gratitude break",
        description:
          "Think of one good thing that happened today. Let your mind reset before continuing."
      }

    };

    function startBreak(type) {

      selectedBreak = type;

      document.getElementById("recommendation").innerText =
        recommendations[type].title;

      document.getElementById("description").innerText =
        recommendations[type].description;

      document.getElementById("result").style.display = "block";

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }

    function startTimer() {

      if (timerRunning) return;

      timerRunning = true;
      seconds = 60;

      const timer = document.getElementById("timer");
      const bar = document.getElementById("bar");

      const interval = setInterval(() => {

        seconds--;

        let min = Math.floor(seconds / 60);
        let sec = seconds % 60;

        timer.innerText =
          String(min).padStart(2, "0") +
          ":" +
          String(sec).padStart(2, "0");

        bar.style.width = ((60 - seconds) / 60 * 100) + "%";

        if (seconds <= 0) {

          clearInterval(interval);

          timer.innerText = "Done! 🎉";

          breakCount++;

          document.getElementById("breakCount").innerText =
            breakCount;

          timerRunning = false;

          alert("Great job! Your mindful break is complete. 🧠✨");

        }

      }, 1000);

    }

  </script>
